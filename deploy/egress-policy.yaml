# EgressPolicy for the email agent actor. The agent may reach exactly two
# places, and every credential on those requests comes from Substrate:
#   1. Gmail. The gateway replaces Authorization with the user's OAuth token,
#      fetched from the Auth Manager credential provider. The URI names only
#      the scope; the user is the actor's atespace.
#   2. The email app's internal API. The gateway replaces Authorization with an
#      actor JWT (aud: email-app) naming this actor.
rules:
- https:
    hostnames: ["gmail.googleapis.com"]
    effects:
      replaceHeaders:
      - header: Authorization
        prefix: "Bearer "
        credentialUri: ate-secret://authmanager.demo/oauth/gmail.readonly
- http:
    hostnames: ["email-app.email-app.svc.cluster.local"]
    ports:
      numbers: [8080]
    effects:
      replaceHeaders:
      - header: Authorization
        prefix: "Bearer "
        actorJwt:
          audiences: ["email-app"]
          expirationSeconds: 300
